name: resize stickers
on:
  push:
    paths:
      - '*.jpg'
      - '*.JPG'
      - '*.jpeg'
      - '*.png'
      - '*.PNG'
      - '*.gif'
      - '*.GIF'
      - '.github/workflows/resize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resize
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p s
          shopt -s nullglob nocaseglob
          for f in *.jpg *.jpeg *.png *.gif; do
            out="s/$f"
            case "${f,,}" in
              *.gif) convert "$f" -coalesce -resize '120x120>' -layers Optimize "$out" ;;
              *) convert "$f" -resize '120x120>' -strip -quality 85 "$out" ;;
            esac
            echo "done $f"
          done
      - name: commit
        run: |
          git config user.name "sticker-bot"
          git config user.email "sticker-bot@users.noreply.github.com"
          git add s
          git diff --cached --quiet || git commit -m "resize stickers to 120"
          git push
